name: Dashboard checks
on:
  push:
    branches: [main, feature/media-lens-dashboard, feature/article-classifiers, feature/llm-reliability]
  pull_request:
    branches: [main, feature/article-classifiers]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
